<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sabor &middot; Restaurante</title>
  <link rel="stylesheet" href="./css/estilos.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' rx='5' fill='%23d62828'/><g fill='none' stroke='white' stroke-width='1.6'><circle cx='12' cy='12' r='6.2'/><circle cx='12' cy='12' r='2.4'/></g></svg>">
  <!-- Sin <script> en línea: la Content-Security-Policy solo admite código
       servido desde este mismo origen. La configuración vive en js/config.js. -->
  <script type="module" src="./js/config.js"></script>
</head>
<body>
  <header class="cabecera" id="cabecera" hidden>
    <a class="marca" href="#/menu">
      <span class="marca__icono"><svg class="ico" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="3.25"/></svg></span>
      <span class="marca__texto">Sabor</span>
    </a>

    <nav class="nav" id="nav"></nav>

    <div class="avisador" id="avisador"></div>

    <div class="sesion" id="sesion"></div>

    <button class="hamburguesa" id="hamburguesa" aria-label="Abrir menú" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </header>

  <main class="contenido" id="vista"></main>

  <div class="avisos" id="avisos" aria-live="polite"></div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
